<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. — Comms Channel</title>
<style>
:root{
  --bg:#070d17; --panel:#0c1727; --line:rgba(64,196,255,.22);
  --cyan:#3fd2ff; --dim:#6fa8bf; --amber:#ffab4a; --text:#dcf5ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Segoe UI",Arial,Helvetica,sans-serif; color:var(--text);
  background:
    linear-gradient(rgba(64,196,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(64,196,255,.045) 1px,transparent 1px),
    var(--bg);
  background-size:42px 42px;
  display:flex; flex-direction:column;
}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line)}
.logo{color:var(--cyan);font-weight:700;letter-spacing:5px;font-size:15px;text-shadow:0 0 12px rgba(63,210,255,.5)}
.hud-btn{display:inline-block;padding:6px 14px;border:1px solid var(--cyan);background:rgba(63,210,255,.08);
  color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.15s}
.hud-btn:hover{background:rgba(63,210,255,.22);color:#eaffff;box-shadow:0 0 14px rgba(63,210,255,.45)}
main{flex:1;display:flex;justify-content:center;padding:26px 16px;min-height:0}
.panel{
  width:100%;max-width:860px;display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border:1px solid var(--line);padding:16px 18px;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
.panel h2{margin:0 0 4px;font-size:12px;letter-spacing:3px;color:var(--dim);font-weight:600}
.status{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:10px}
.status b{color:var(--amber)}
#chat{flex:1;overflow-y:auto;border:1px solid var(--line);background:rgba(4,10,18,.5);padding:12px;min-height:0}
.msg{border:1px solid var(--line);border-left:3px solid var(--cyan);background:rgba(20,45,70,.35);padding:8px 12px;margin:8px 0}
.msg .who{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.msg .who .name{color:var(--cyan)}
.msg .body{margin-top:5px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bar{display:flex;gap:8px;margin-top:10px}
.bar input{flex:1;background:rgba(4,10,18,.6);border:1px solid var(--line);color:var(--text);padding:10px 12px;font-size:14px;outline:none}
.bar input:focus{border-color:var(--cyan)}
#name-input{max-width:180px}
button.send{border:1px solid var(--cyan);background:rgba(63,210,255,.10);color:var(--cyan);padding:10px 20px;
  font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.15s}
button.send:hover{background:rgba(63,210,255,.25);color:#eaffff;box-shadow:0 0 14px rgba(63,210,255,.4)}
</style>
</head>
<body>
<header>
  <span class="logo">J.A.R.V.I.S.</span>
  <a class="hud-btn" href="index.html">⬅ Back to Console</a>
</header>

<main>
  <section class="panel">
    <h2>COMMS CHANNEL — PEOPLE CHAT</h2>
    <div class="status">CHANNEL: <b>OPEN</b> · messages refresh automatically</div>
    <div id="chat"></div>
    <div class="bar">
      <input id="name-input" maxlength="24" placeholder="CALLSIGN" autocomplete="off">
      <input id="text-input" maxlength="500" placeholder="Transmit a message…" autocomplete="off">
      <button class="send" id="send-btn">Send</button>
    </div>
  </section>
</main>

<script>
const chat = document.getElementById("chat");
const nameInput = document.getElementById("name-input");
const textInput = document.getElementById("text-input");

nameInput.value = localStorage.getItem("jarvis-callsign") || "";
nameInput.addEventListener("input", () => localStorage.setItem("jarvis-callsign", nameInput.value));

let lastId = 0;

function addMessage(m){
  const row = document.createElement("div"); row.className = "msg";
  const who = document.createElement("div"); who.className = "who";
  const n = document.createElement("span"); n.className = "name"; n.textContent = m.name;
  const t = document.createElement("span"); t.textContent = m.time;
  who.appendChild(n); who.appendChild(t);
  const body = document.createElement("div"); body.className = "body"; body.textContent = m.text;
  row.appendChild(who); row.appendChild(body);
  chat.appendChild(row);
}

async function load(){
  try{
    const r = await fetch("api/messages?after=" + lastId);
    const d = await r.json();
    if (d.lastId < lastId){ chat.innerHTML = ""; lastId = 0; }
    for (const m of d.messages || []){ addMessage(m); lastId = Math.max(lastId, m.id); }
    if ((d.messages || []).length) chat.scrollTop = chat.scrollHeight;
  }catch(e){ /* server not reachable yet */ }
}

async function send(){
  const text = textInput.value.trim();
  if (!text) return;
  const name = nameInput.value.trim() || "Guest";
  try{
    const r = await fetch("api/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name, text})
    });
    const d = await r.json();
    if (d.ok){ textInput.value = ""; load(); }
    else alert(d.error || "Transmission failed.");
  }catch(e){
    alert("Uplink error — make sure the server is running (python app.py) and you opened the site via http://127.0.0.1:5000");
  }
  textInput.focus();
}

document.getElementById("send-btn").addEventListener("click", send);
textInput.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); send(); } });

load();
setInterval(load, 1200);
</script>
</body>
</html>
