<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05101d; --panel:#07182a; --line:#123c5e;
  --cyan:#3fe0ff; --cyan-dim:#1a7f99; --amber:#ffb54d; --red:#ff5d5d; --text:#cfeaf5;
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Rajdhani",sans-serif; font-size:17px; overflow-x:hidden;
}
body::before{ /* grid */
  content:""; position:fixed; inset:0; pointer-events:none;
  background:
    linear-gradient(rgba(63,224,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(63,224,255,.045) 1px, transparent 1px);
  background-size:44px 44px;
}
body::after{ /* scanline */
  content:""; position:fixed; left:0; right:0; height:120px; top:-120px; pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(63,224,255,.06), transparent);
  animation:scan 7s linear infinite;
}
@keyframes scan{to{top:110vh}}

/* ===== PEOPLE CHAT BUTTON ===== */
#people-chat-btn{
  display:inline-block;
  padding:6px 14px;
  margin-right:10px;
  border:1px solid #35c8f0;
  background:rgba(53,200,240,.08);
  color:#35c8f0;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  text-decoration:none;
  cursor:pointer;
  transition:.15s;
}
#people-chat-btn:hover{
  background:rgba(53,200,240,.22);
  color:#eaffff;
  box-shadow:0 0 14px rgba(53,200,240,.45);
}  

header{
  display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  padding:18px 28px; border-bottom:1px solid var(--line);
  font-family:"Orbitron",sans-serif;
}
header h1{font-size:1.5rem; letter-spacing:.35em; color:var(--cyan);
  text-shadow:0 0 18px rgba(63,224,255,.6)}
header .meta{font-size:.75rem; letter-spacing:.15em; color:var(--cyan-dim); text-align:right}
header .meta b{color:var(--amber)}

main{display:grid; grid-template-columns:340px 1fr; gap:22px; padding:22px 28px; max-width:1200px; margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}

.panel{
  background:var(--panel); border:1px solid var(--line); padding:20px; position:relative;
  clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
}
.panel h2{font-family:"Orbitron"; font-size:.7rem; letter-spacing:.3em;
  color:var(--cyan-dim); margin-bottom:16px}

/* ---- arc reactor ---- */
.orb{width:200px; height:200px; margin:6px auto 18px; position:relative}
.orb .ring{position:absolute; border-radius:50%; border:1px solid var(--cyan-dim)}
.r1{inset:0; border-color:rgba(63,224,255,.35)}
.r2{inset:16px; border:1.5px dashed var(--cyan); animation:spin 14s linear infinite}
.r3{inset:36px; border:1.5px dashed var(--amber); opacity:.55; animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core{
  position:absolute; inset:58px; border-radius:50%;
  background:radial-gradient(circle, #eafcff 0%, var(--cyan) 35%, #0a4a63 75%, transparent 100%);
  box-shadow:0 0 30px rgba(63,224,255,.7), 0 0 90px rgba(63,224,255,.25);
  animation:pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(.94); box-shadow:0 0 18px rgba(63,224,255,.5)}}
.orb.listening .r2{border-color:var(--amber)}
.orb.listening .core{animation-duration:1.1s}
.orb.speaking .core{animation-duration:.45s;
  box-shadow:0 0 45px rgba(63,224,255,.95), 0 0 120px rgba(63,224,255,.4)}

.state{ text-align:center; font-family:"Orbitron"; font-size:.65rem;
  letter-spacing:.3em; color:var(--cyan); min-height:1.2em}
.wave{display:flex; gap:5px; justify-content:center; height:26px; align-items:flex-end; margin-top:12px}
.wave span{width:4px; height:6px; background:var(--cyan); opacity:.45}
.orb.speaking ~ .wave span{animation:eq .5s ease-in-out infinite alternate}
.wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}
.wave span:nth-child(4){animation-delay:.05s}.wave span:nth-child(5){animation-delay:.15s}
@keyframes eq{from{height:5px}to{height:24px}}

/* ---- console ---- */
#log{height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:6px}
.msg{max-width:85%; padding:9px 14px; border:1px solid var(--line); line-height:1.35; white-space:pre-wrap}
.msg.jarvis{align-self:flex-start; border-left:3px solid var(--cyan); background:rgba(63,224,255,.05)}
.msg.user{align-self:flex-end; border-right:3px solid var(--amber); background:rgba(255,181,77,.05)}
.msg .who{display:block; font-family:"Orbitron"; font-size:.55rem; letter-spacing:.25em;
  color:var(--cyan-dim); margin-bottom:3px}
.msg.user .who{color:var(--amber); text-align:right}

form{display:flex; gap:10px; margin-top:14px}
input[type=text]{
  flex:1; background:#04101c; border:1px solid var(--line); color:var(--text);
  padding:11px 14px; font-family:"Rajdhani"; font-size:1.05rem; outline:none;
}
input[type=text]:focus{border-color:var(--cyan); box-shadow:0 0 12px rgba(63,224,255,.25)}
button{
  font-family:"Orbitron"; font-size:.65rem; letter-spacing:.2em; cursor:pointer;
  background:transparent; border:1px solid var(--cyan); color:var(--cyan); padding:0 18px;
  transition:background .15s, color .15s;
}
button:hover{background:var(--cyan); color:#04101c}
#mic.rec{border-color:var(--red); color:var(--red); animation:pulse 1s infinite}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.chip{font-family:"Rajdhani"; font-size:.85rem; letter-spacing:.05em; padding:4px 12px;
  border:1px solid var(--line); color:var(--cyan-dim); cursor:pointer; text-transform:none}
.chip:hover{border-color:var(--amber); color:var(--amber)}
</style>
</head>
<body>

<header>
  <h1>J.A.R.V.I.S.</h1>
  <div class="meta">
    CORE: <b>ONLINE</b> · UPLINK: <b>STABLE</b><br>
    <span id="clock">--:--:--</span> UTC
  </div>
</header>

<main>
  <section class="panel">
    <h2>REACTOR INTERFACE</h2>
    <div class="orb" id="orb">
      <div class="ring r1"></div><div class="ring r2"></div>
      <div class="ring r3"></div><div class="core"></div>
    </div>
    <div class="state" id="state">STANDBY</div>
    <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
  </section>

  <section class="panel">
    <h2>COMMAND CONSOLE</h2>
    <div id="log"></div>
    <form id="form">
      <input type="text" id="input" placeholder='Speak or type… try "help"' autocomplete="off">
      <button type="submit">SEND</button>
      <button type="button" id="mic">🎤 MIC</button>
    </form>
    <div class="chips" id="chips"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const orb = $("#orb"), stateEl = $("#state"), log = $("#log");
const pick = a => a[Math.floor(Math.random()*a.length)];

const JOKES = ["I would tell you a UDP joke, but you might not get it.",
  "There are 10 kinds of people: those who understand binary, and those who don't.",
  "Why did the developer go broke? He used up all his cache.",
  "It works on my machine. Luckily, I am the machine."];
const QUOTES = ["Sometimes you have to run before you can walk.",
  "The best way to predict the future is to invent it.",
  "First, solve the problem. Then, write the code.",
  "Simplicity is the soul of efficiency."];
const SITES = {youtube:"https://youtube.com", google:"https://google.com",
  github:"https://github.com", x:"https://x.com", twitter:"https://x.com"};
const HELP = "Protocols: time · date · weather in <city> · wiki <topic> · calc 2^10 · " +
  "joke · quote · flip a coin · roll 2d6 · note <text> · remind me to <x> at HH:MM · " +
  "notes · open youtube · who made you · clear notes";

/* ---------- storage ---------- */
const store = {
  get notes(){ return JSON.parse(localStorage.getItem("jarvis.notes")||"[]") },
  set notes(v){ localStorage.setItem("jarvis.notes", JSON.stringify(v)) },
  get rems(){ return JSON.parse(localStorage.getItem("jarvis.rems")||"[]") },
  set rems(v){ localStorage.setItem("jarvis.rems", JSON.stringify(v)) },
};

/* ---------- speech ---------- */
function speak(text){
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text.replace(/[🕐📅🌤🧮🎲🪙😏💬📚]/g,""));
  const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith("en") && /male|daniel|google uk/i.test(v.name))
          || speechSynthesis.getVoices().find(v=>v.lang.startsWith("en"));
  if(v) u.voice = v;
  u.onstart = ()=>{ orb.classList.add("speaking"); stateEl.textContent="SPEAKING"; };
  u.onend   = ()=>{ orb.classList.remove("speaking"); stateEl.textContent="STANDBY"; };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if(SR){
  rec = new SR(); rec.lang="en-US"; rec.interimResults=false;
  rec.onresult = e => handle(e.results[0][0].transcript);
  rec.onend = ()=>{ $("#mic").classList.remove("rec"); orb.classList.remove("listening");
                    stateEl.textContent="STANDBY"; };
  rec.onerror = e => logMsg("jarvis", e.error==="not-allowed"
    ? "Microphone access denied. Allow it in your browser, sir."
    : "I could not catch that. Do enunciate.");
}
$("#mic").onclick = ()=>{
  if(!rec){ logMsg("jarvis","This browser lacks speech recognition. Chrome or Edge recommended."); return; }
  if($("#mic").classList.contains("rec")){ rec.stop(); return; }
  speechSynthesis.cancel();
  orb.classList.add("listening"); stateEl.textContent="LISTENING";
  $("#mic").classList.add("rec"); rec.start();
};

/* ---------- UI ---------- */
function logMsg(who, text){
  const d = document.createElement("div");
  d.className = "msg "+who;
  d.innerHTML = `<span class="who">${who==="user"?"YOU":"JARVIS"}</span>`;
  d.appendChild(document.createTextNode(text));
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

/* ---------- brain ---------- */
const isArith = t => /^[0-9+\-*/().%\s^x×÷]+$/.test(t);
function calc(expr){
  expr = expr.replaceAll("^","**").replaceAll("x","*").replaceAll("×","*").replaceAll("÷","/");
  if(!/^[0-9+\-*/().%\s]+$/.test(expr)) return "That expression does not parse, sir.";
  try{ return "🧮 Result: " + Function('"use strict";return('+expr+')')(); }
  catch{ return "That expression does not parse, sir."; }
}

async function weather(city){
  try{
    let lat, lon, label;
    if(city){
      const g = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1")).json();
      if(!g.results?.length) return `I cannot locate '${city}' on any map available to me.`;
      lat=g.results[0].latitude; lon=g.results[0].longitude; label=g.results[0].name;
    } else {
      const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej));
      lat=pos.coords.latitude; lon=pos.coords.longitude; label="your location";
    }
    const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)).json();
    return `🌤 ${label}: ${f.current_weather.temperature}°C, wind ${f.current_weather.windspeed} km/h.`;
  }catch{ return "Weather uplink failed, sir. Check permissions or try again."; }
}

async function wiki(topic){
  const u = "https://en.wikipedia.org/w/api.php?action=query&format=json&prop=extracts" +
    "&exintro=1&explaintext=1&redirects=1&origin=*&titles="+encodeURIComponent(topic);
  const d = await (await fetch(u)).json();
  const p = Object.values(d.query.pages)[0];
  return p.missing!==undefined ? `My archives turn up nothing on '${topic}'.`
    : `📚 ${p.title}: ${p.extract.slice(0,420)}`;
}

async function route(raw){
  const t = raw.trim(); const low = t.toLowerCase();
  if(!low) return "I'm listening.";
  let m;

  if(low==="help") return HELP;
  if(/^(hi|hello|hey|yo)\b/.test(low)) return pick(["At your service.","Online and listening.","What do you need?"]);
  if(low.includes("who made you")||low==="who are you")
    return "I am J.A.R.V.I.S. — assembled by you, running in your browser, spiritually hosted on GitHub.";
  if(low.includes("time")) return "🕐 " + new Date().toLocaleTimeString();
  if(low.includes("date")||low.includes("today"))
    return "📅 " + new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  if(low.includes("joke")) return "😏 "+pick(JOKES);
  if(low.includes("quote")||low.includes("inspire")) return "💬 "+pick(QUOTES);
  if(low.includes("flip")&&low.includes("coin")) return "🪙 "+(Math.random()<.5?"Heads.":"Tails.");
  if(m=low.match(/roll\s+(\d*)d(\d+)/)){
    const n=Math.min(parseInt(m[1]||1),50), s=parseInt(m[2]);
    const rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*s));
    return `🎲 ${rolls.join(", ")} — total ${rolls.reduce((a,b)=>a+b,0)}.`;
  }
  if(low.startsWith("calc ")||low.startsWith("calculate "))
    return calc(low.replace(/^(calc|calculate)\s+/,""));
  if(isArith(t)) return calc(t);

  if(low.startsWith("weather"))
    return weather(low.replace(/^weather\s*(in|for|at)?\s*/,""));

  m = low.match(/^(?:who|what) (?:is|are|was) (.+)/);
  if(m) return wiki(m[1].replace(/\?+$/,""));
  if(low.startsWith("wiki ")) return wiki(t.slice(5));

  if(m=low.match(/^open (\w+)/)){
    const url = SITES[m[1]] || `https://www.google.com/search?q=${encodeURIComponent(m[1])}`;
    window.open(url,"_blank"); return `Opening ${m[1]}, sir.`;
  }
  if(m=low.match(/^search(?: for)? (.+)/)){
    window.open("https://www.google.com/search?q="+encodeURIComponent(m[1]),"_blank");
    return "Searching now.";
  }

  if(m=t.match(/^remind me to (.+?) at (\d{1,2}):(\d{2})$/i)){
    const due=new Date(); due.setHours(+m[2],+m[3],0,0);
    if(due<Date.now()) due.setDate(due.getDate()+1);
    store.rems=[...store.rems,{text:m[1],due:due.toISOString()}];
    return `Noted. I'll remind you at ${due.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}.`;
  }
  if(m=t.match(/^(?:note|remember) (.+)/i)){
    store.notes=[...store.notes,{text:m[1],at:new Date().toLocaleString()}];
    return "Committed to memory.";
  }
  if(low==="notes"||low==="reminders"){
    const n=store.notes.map(x=>"• "+x.text), r=store.rems.map(x=>"⏰ "+x.text);
    return [...n,...r].length ? [...n,...r].join("\n") : "The slate is clean, sir.";
  }
  if(low==="clear notes"){ store.notes=[]; store.rems=[]; return "Memory wiped."; }

  return "I don't have a protocol for that. Try 'help'.";
}

/* ---------- loop ---------- */
async function handle(text){
  if(!text.trim()) return;
  logMsg("user", text);
  stateEl.textContent="PROCESSING";
  const answer = await route(text);
  logMsg("jarvis", answer);
  speak(answer);
}

$("#form").onsubmit = e => { e.preventDefault(); const v=$("#input").value; $("#input").value=""; handle(v); };

["time","weather in Tokyo","flip a coin","roll 2d6","wiki Albert Einstein",
 "calc 2^16","joke","note call HQ","help"].forEach(c=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=c;
  b.onclick=()=>handle(c); $("#chips").appendChild(b);
});

setInterval(()=>{
  $("#clock").textContent = new Date().toISOString().slice(11,19);
  const now=Date.now(), due=store.rems.filter(r=>new Date(r.due)<=now);
  if(due.length){
    store.rems=store.rems.filter(r=>new Date(r.due)>now);
    due.forEach(r=>{ logMsg("jarvis","⏰ Reminder: "+r.text); speak("Reminder: "+r.text); });
  }
},1000);

logMsg("jarvis","Jarvis online. Voice recognition armed — press the mic, or type. Say 'help' for protocols.");
speechSynthesis.getVoices(); // warm up voices
</script>
</body>
</html>
